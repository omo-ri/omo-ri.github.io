######## Sidebar ########
# 左上角 logo 区域（avatar / title 用主题默认值，取自 _config.yml 的 avatar / title）
logo:
  subtitle: Everything is going to be okay. | Determination.

# 侧边栏主导航（主题只读 items，注意没有 columns 这个配置）
menubar:
  items:
    # id: 页面中高亮的 menu_id / theme: 高亮颜色 / icon: 见主题 _data/icons.yml / url: 跳转地址
    - id: post
      theme: '#1BCDFC'
      icon: example:planet
      title: 博客
      url: /
    - id: about
      theme: '#3DC550'
      icon: default:documents
      title: 关于
      url: /about/
    # 站内暂无笔记本内容（source/ 下没有 notebooks），开启会 404
    # - id: notebooks
    #   theme: '#FA6400'
    #   icon: example:notebook
    #   title: 笔记
    #   url: /notebooks/
    # - id: friends
    #   theme: '#F44336'
    #   icon: example:chat
    #   title: 友链
    #   url: /friends/


######## Article ########
article:
  # 文章许可协议（主题默认是 CC BY-NC-SA 4.0）
  license: '本文采用 [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/deed.zh-hans) 许可协议，转载请注明出处。'
  # 分享方式，可选 [wechat, weibo, email, link]，主题默认为空（不显示）
  share: [wechat, link]


######## Style ########
style:
  prefers_theme: dark # auto / light / dark，主题默认 auto
  font-family:
    body: '"LXGW WenKai Screen", system-ui, "Microsoft Yahei", "Segoe UI", Arial, sans-serif'
  border-radius:
    bar: 8px # 横条类元素圆角，主题默认 12px
  leftbar:
    # glass = 背景图 + 磨砂玻璃；card = 纯色卡片（1.39.0 起的主题默认值）
    # 还可设 blur-px（默认 100px）和 background-opacity（默认 0.8，暗色下自动 ×0.75）
    ui-style: glass
    background-image: url(https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.13/image/sidebar-bg1@small.jpg)
  site: # 全站背景图，设了 background-image 之后 blur 才有效
    background-image: url(https://cdn.jsdmirror.com/gh/omo-ri/omo-ri.github.io/source/assets/images/background.jpg)
    blur-px: 5px # 主题默认 100px
    blur-bg: var(--bg-a20) # 主题默认 var(--bg-a75)
    blur-sat: 100% # 主题默认 300%


######## Plugins ########
# 主题的 layout/_plugins/index.ejs 里：某个 plugin 一旦配了 inject，
# 就用 inject 的内容代替主题自带的 ejs partial。
# 触发条件不变，仍然是文章 front-matter 里写 mathjax: true。
plugins:
  mathjax:
    # 覆盖主题默认（MathJax 2.7.6 + matchFontHeight 默认开启）。
    # matchFontHeight 会把公式缩放到与周围文字的 x-height 对齐，
    # 而霞鹜文楷的 sxHeight 只有 468/2048 ≈ 0.23em（常见拉丁字体约 0.5em），
    # 导致公式被压到 ~50%。关掉它，公式就按 1em 正常渲染。
    inject:
      - <script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']],processEscapes:true},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']},chtml:{matchFontHeight:false}};</script><script id="MathJax-script" async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js"></script>


inject:
  head:
    - <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
    - <link rel="stylesheet" href="/css/custom.css">
